name: Build ParaEQ

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - build/ParaEQ_artefacts/Release/VST3/ParaEQ.vst3
          codesign --force --deep -s - build/ParaEQ_artefacts/Release/AU/ParaEQ.component

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ParaEQ-${{ matrix.name }}
          path: |
            build/ParaEQ_artefacts/Release/VST3
            build/ParaEQ_artefacts/Release/AU
